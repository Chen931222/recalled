name: Update recall data

# Rebuilds site/data from the CPSC and Health Canada open data once a day, runs the
# matcher evaluation and both sites' tests, and commits the data only if all pass.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download and rebuild the index
        run: python scripts/build_data.py
      - name: Matcher evaluation
        run: node tests/eval.mjs
      - name: Site tests
        run: node --test "site/tests/*.test.mjs" "market/tests/*.test.mjs"
      - name: Commit if the notices changed
        run: |
          if git diff --quiet -- site/data/recalls.json; then
            echo "No new notices."
            exit 0
          fi
          git config user.name "recalled-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data tests/eval-result.json
          git commit -m "Data: $(python -c 'import json;m=json.load(open("site/data/meta.json"));print(sum(m["counts"].values()),"notices, newest",m["newest"])')"
          git push
